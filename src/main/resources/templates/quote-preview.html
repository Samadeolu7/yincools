<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <title>Quote</title>
    <style>
        h1 { font-size: 1.3rem; margin: 0 0 1rem; text-align: center; }
        .converted {
            margin-top: 1rem;
            padding: 0.9rem;
            border: 2px solid var(--color-ink);
            background: var(--color-surface-muted);
            color: var(--color-ink);
            border-radius: var(--radius);
            font-weight: 600;
            text-align: center;
        }
        .whatsapp { background: #25D366; color: var(--color-surface); }
        .email-share { background: var(--color-ink); color: var(--color-surface); }
        .converted a {
            display: block;
            margin-top: 0.4rem;
            color: var(--color-primary);
            font-weight: 700;
        }
    </style>
</head>
<body>
<!-- Plain app chrome -- deliberately NOT styled like the document below.
     The .quote-doc card is the one thing meant to look like a real
     quotation; everything outside it is just a normal app screen. -->
<h1>Quote</h1>

<div class="converted" th:if="${quote.convertedToJobId != null}">
    Converted to a job already.
    <a th:href="@{/jobs/{id}/edit(id=${quote.convertedToJobId})}">View / edit that job</a>
</div>

<div id="shareableQuote" class="quote-doc">
    <div id="letterheadChromeTop">
        <div class="quote-doc-header">
            <img src="/images/yincools-logo.png" alt="" class="quote-doc-logo">
            <div class="quote-doc-identity">
                <div class="quote-doc-name" th:text="${businessName}"></div>
                <span class="quote-doc-suffix" th:if="${businessSuffix != null and !businessSuffix.isEmpty()}" th:text="${businessSuffix}"></span>
                <div class="quote-doc-tagline" th:if="${businessTagline != null and !businessTagline.isEmpty()}" th:text="${businessTagline}"></div>
            </div>
        </div>
        <hr class="quote-doc-divider">
        <div class="quote-doc-title-row">
            <div class="quote-doc-title">QUOTATION</div>
            <span class="quote-doc-badge">ESTIMATE</span>
        </div>
    </div>

    <div id="quoteCard">
        <hr class="quote-doc-divider">
        <div class="quote-doc-meta">
            <span>Quote No <strong th:text="${quoteNumber}"></strong></span>
            <span th:text="${quote.date}"></span>
        </div>

        <hr class="quote-doc-divider">
        <div class="quote-doc-info">
            <div class="quote-doc-field" th:if="${customer != null and customer.name != null and !customer.name.isEmpty()}">
                <div class="quote-doc-label">Customer</div>
                <div class="quote-doc-value" th:text="${customer.name}"></div>
            </div>
            <div class="quote-doc-field" th:if="${vehicleLabel != null and !vehicleLabel.isEmpty()}">
                <div class="quote-doc-label">Vehicle</div>
                <div class="quote-doc-value" th:text="${vehicleLabel}"></div>
            </div>
            <div class="quote-doc-field">
                <div class="quote-doc-label">Service</div>
                <div class="quote-doc-value" th:text="${quote.workType}"></div>
            </div>
        </div>

        <hr class="quote-doc-divider">
        <table class="quote-doc-table">
            <thead>
                <tr><th>Description</th><th class="qty">Qty</th><th class="amount">Amount</th></tr>
            </thead>
            <tbody>
                <tr th:each="item : ${items}">
                    <td th:text="${item.partName}"></td>
                    <td class="qty">1</td>
                    <td class="amount" th:text="'₦' + ${#numbers.formatDecimal(item.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                </tr>
            </tbody>
        </table>

        <div class="quote-doc-total">
            <span class="quote-doc-total-label">TOTAL</span>
            <span class="quote-doc-total-value" th:text="'₦' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>
    </div>

    <div id="letterheadChromeBottom">
        <hr class="quote-doc-divider">
        <div class="quote-doc-signature">
            <div class="label">Prepared By</div>
            <div class="line"></div>
            <div class="name" th:text="${businessName} + (${businessSuffix != null and !businessSuffix.isEmpty()} ? ' ' + ${businessSuffix} : '')"></div>
        </div>

        <hr class="quote-doc-divider">
        <div class="quote-doc-footer">
            <div class="quote-doc-footer-col">
                <strong>Address</strong>
                <span th:if="${businessAddress != null and !businessAddress.isEmpty()}" th:text="${businessAddress}"></span>
                <div th:if="${businessWhatsapp != null and !businessWhatsapp.isEmpty()}" th:text="'WhatsApp: ' + ${businessWhatsapp}"></div>
                <div th:if="${businessTel != null and !businessTel.isEmpty()}" th:text="'Tel: ' + ${businessTel}"></div>
            </div>
            <div class="quote-doc-footer-col" style="text-align:right">
                <strong>Contact</strong>
                <span th:if="${businessEmail != null and !businessEmail.isEmpty()}" th:text="${businessEmail}"></span>
                <div th:if="${not #lists.isEmpty(businessBankers)}" style="margin-top:0.6rem;">
                    <strong>Banks</strong>
                    <div th:each="b : ${businessBankers}" th:text="${b}"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<button type="button" id="shareQuoteBtn" class="btn btn-primary" style="display:none;"
        data-share-title="Quote" th:attr="data-share-text=${quoteText}">
    Share Quote
</button>

<a th:if="${whatsappLink != null}" th:href="${whatsappLink}" class="btn whatsapp fallback-share" target="_blank">
    Share on WhatsApp
</a>
<a th:href="${mailtoLink}" class="btn email-share fallback-share">Share by Email</a>

<form th:if="${quote.convertedToJobId == null}" method="post" th:action="@{/quotes/{id}/convert(id=${quote.id})}">
    <button type="submit" class="btn btn-primary">Convert to Job</button>
</form>

<a th:href="@{/quotes/{id}/edit(id=${quote.id})}" class="btn btn-ink-outline">Edit Quote</a>

<a th:href="@{/quotes/new}" class="btn btn-outline">New quote</a>

<script src="/vendor/html2canvas.min.js"></script>
<script src="/quote-share.js"></script>
</body>
</html>
