<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <title>Quote</title>
    <style>
        h1 { font-size: 1.3rem; margin: 0 0 1rem; text-align: center; }
        .card { line-height: 1.7; }
        .card .row { display: flex; justify-content: space-between; margin-bottom: 0.3rem; }
        .converted {
            margin-top: 1rem;
            padding: 0.9rem;
            border: 2px solid var(--color-ink);
            background: var(--color-surface-muted);
            color: var(--color-ink);
            border-radius: var(--radius);
            font-weight: 600;
            text-align: center;
        }
        .whatsapp { background: #25D366; color: var(--color-surface); }
        .email-share { background: var(--color-ink); color: var(--color-surface); }
    </style>
</head>
<body>
<div th:replace="~{fragments/letterhead :: header}"></div>
<h1>Quote</h1>

<div class="card">
    <div class="row"><span>Date</span><span th:text="${quote.date}"></span></div>
    <div class="row" th:if="${customer != null and customer.name != null and !customer.name.isEmpty()}">
        <span>Customer</span><span th:text="${customer.name}"></span>
    </div>
    <div class="row" th:if="${vehicleLabel != null and !vehicleLabel.isEmpty()}">
        <span>Vehicle</span><span th:text="${vehicleLabel}"></span>
    </div>
    <div class="row"><span>Work</span><span th:text="${quote.workType}"></span></div>

    <table class="parts-table">
        <thead>
            <tr><th>Part</th><th>Amount</th></tr>
        </thead>
        <tbody>
            <tr class="row-view" th:each="item : ${items}">
                <td th:text="${item.partName}"></td>
                <td style="text-align:right" th:text="'NGN ' + ${item.amount}"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="total-row"><td>Total</td><td th:text="'NGN ' + ${total}"></td></tr>
        </tfoot>
    </table>
</div>

<div th:replace="~{fragments/letterhead :: footer}"></div>

<div class="converted" th:if="${quote.convertedToJobId != null}">
    Converted to a job already.
</div>

<a th:if="${whatsappLink != null}" th:href="${whatsappLink}" class="btn whatsapp" target="_blank">
    Share on WhatsApp
</a>
<a th:href="${mailtoLink}" class="btn email-share">Share by Email</a>

<form th:if="${quote.convertedToJobId == null}" method="post" th:action="@{/quotes/{id}/convert(id=${quote.id})}">
    <button type="submit" class="btn btn-primary">Convert to Job</button>
</form>

<a th:href="@{/quotes/new}" class="btn btn-outline">New quote</a>
</body>
</html>
