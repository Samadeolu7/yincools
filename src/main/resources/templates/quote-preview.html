<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/css/tokens.css">
    <title>Quote</title>
    <style>
        .letterhead {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .letterhead-logo { height: 64px; width: auto; margin-bottom: 0.5rem; }
        .letterhead .business-name { font-size: 1.6rem; font-weight: 700; }
        .letterhead .business-contact { color: var(--color-ink-secondary); font-size: 0.95rem; }
        h1 { font-size: 1.3rem; margin: 0 0 1rem; text-align: center; }
        .card {
            border: 2px solid var(--color-ink);
            border-radius: var(--radius);
            padding: 1.1rem;
            line-height: 1.7;
        }
        .card .row { display: flex; justify-content: space-between; }
        .card .amount {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--color-border-subtle);
            font-size: 1.3rem;
            font-weight: 700;
            text-align: right;
        }
        .converted {
            margin-top: 1rem;
            padding: 0.9rem;
            border: 2px solid var(--color-ink);
            background: var(--color-surface-muted);
            color: var(--color-ink);
            border-radius: var(--radius);
            font-weight: 600;
            text-align: center;
        }
        a.button, button.button {
            display: block;
            width: 100%;
            margin-top: 1rem;
            padding: 1.1rem;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
        }
        .convert { background: var(--color-primary); color: var(--color-surface); }
        .new-quote { background: var(--color-surface); color: var(--color-primary); border: 2px solid var(--color-primary); }
    </style>
</head>
<body>
<div th:replace="~{fragments/letterhead :: letterhead}"></div>
<h1>Quote</h1>

<div class="card">
    <div class="row"><span>Date</span><span th:text="${quote.date}"></span></div>
    <div class="row" th:if="${customer != null and customer.name != null and !customer.name.isEmpty()}">
        <span>Customer</span><span th:text="${customer.name}"></span>
    </div>
    <div class="row" th:if="${vehicleLabel != null and !vehicleLabel.isEmpty()}">
        <span>Vehicle</span><span th:text="${vehicleLabel}"></span>
    </div>
    <div class="row"><span>Work</span><span th:text="${quote.workType}"></span></div>
    <div class="row" th:if="${quote.partsNote != null and !quote.partsNote.isEmpty()}">
        <span>Parts</span><span th:text="${quote.partsNote}"></span>
    </div>
    <div class="amount" th:text="'NGN ' + ${quote.amount}"></div>
</div>

<div class="converted" th:if="${quote.convertedToJobId != null}">
    Converted to a job already.
</div>

<form th:if="${quote.convertedToJobId == null}" method="post" th:action="@{/quotes/{id}/convert(id=${quote.id})}">
    <button type="submit" class="button convert">Convert to Job</button>
</form>

<a th:href="@{/quotes/new}" class="button new-quote">New quote</a>
</body>
</html>
