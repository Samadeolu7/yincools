<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  On every main screen, including New Job -- consistent position/color
  everywhere beats the earlier "keep the 15-20x/day loop nav-free"
  tradeoff. Receipt and Edit Job still stay nav-free: they're reached
  mid-task, immediately after New Job, not a place Dad navigates from.
  Call with th:replace="~{fragments/bottom-nav :: nav('week')}" etc.,
  using the same key as the a.active check below.
-->
<nav th:fragment="nav(active)" class="bottom-nav">
    <a th:href="@{/quotes/new}" th:classappend="${active == 'quote'} ? 'active'">Quote</a>
    <a th:href="@{/jobs/new}" th:classappend="${active == 'job'} ? 'active'">Job</a>
    <a th:href="@{/insights/week}" th:classappend="${active == 'week'} ? 'active'">Week</a>
    <a th:href="@{/insights/debtors}" th:classappend="${active == 'debtors'} ? 'active'">Owed</a>
    <a th:href="@{/expenses/new}" th:classappend="${active == 'expense'} ? 'active'">Spend</a>
</nav>
</body>
</html>
