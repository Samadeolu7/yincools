<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Only on the occasional screens (This Week, Who Owes Me, Shop Expense,
  New Quote) -- New Job/Receipt/Edit Job deliberately don't include this,
  they stay as navigation-free as before. Call with th:replace="~{fragments/bottom-nav :: nav('week')}"
  etc., using the same key as the a.active check below.
-->
<nav th:fragment="nav(active)" class="bottom-nav">
    <a th:href="@{/jobs/new}" th:classappend="${active == 'job'} ? 'active'">Job</a>
    <a th:href="@{/quotes/new}" th:classappend="${active == 'quote'} ? 'active'">Quote</a>
    <a th:href="@{/insights/week}" th:classappend="${active == 'week'} ? 'active'">Week</a>
    <a th:href="@{/insights/debtors}" th:classappend="${active == 'debtors'} ? 'active'">Owed</a>
    <a th:href="@{/expenses/new}" th:classappend="${active == 'expense'} ? 'active'">Spend</a>
</nav>
</body>
</html>
