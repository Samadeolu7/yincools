<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <title>Credit Supplier Report</title>
    <style>
        h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
        .subtitle { color: var(--color-ink-secondary); font-size: 0.9rem; margin-bottom: 1.25rem; }
        .range-form { display: flex; gap: 0.6rem; align-items: flex-end; margin-bottom: 1.5rem; }
        .range-form div { flex: 1; }
        .range-form label { font-size: 0.8rem; margin: 0 0 0.25rem; }
        .range-form input { padding: 0.6rem; font-size: 0.95rem; }
        .range-form button { margin-top: 0; padding: 0.6rem 1rem; width: auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        th { text-align: left; font-size: 0.8rem; color: var(--color-ink-secondary); border-bottom: 2px solid var(--color-ink); padding-bottom: 0.4rem; }
        td { padding: 0.6rem 0.4rem 0.6rem 0; border-bottom: 1px solid var(--color-border-subtle); font-size: 0.9rem; vertical-align: top; }
        td.amount { text-align: right; white-space: nowrap; }
        .empty { color: var(--color-ink-secondary); padding: 1rem 0; }
        .total-row td { font-weight: 700; border-top: 2px solid var(--color-ink); border-bottom: none; }
    </style>
</head>
<body>
<h1>Credit Supplier Report</h1>
<div class="subtitle" th:text="${rangeStart} + ' to ' + ${rangeEnd}"></div>

<form method="get" th:action="@{/suppliers/credit}" class="range-form">
    <div>
        <label for="start">From</label>
        <input type="date" id="start" name="start" th:value="${rangeStart}">
    </div>
    <div>
        <label for="end">To</label>
        <input type="date" id="end" name="end" th:value="${rangeEnd}">
    </div>
    <button type="submit" class="btn btn-ink-outline">Filter</button>
</form>

<p class="empty" th:if="${#lists.isEmpty(rows)}">Nothing tagged to the credit supplier in this range.</p>

<table th:if="${not #lists.isEmpty(rows)}">
    <thead>
        <tr><th>Date</th><th>Customer / Vehicle</th><th>Note</th><th class="amount">Amount</th></tr>
    </thead>
    <tbody>
        <tr th:each="row : ${rows}">
            <td th:text="${row.entry.date}"></td>
            <td>
                <span th:if="${row.customerLabel != null}" th:text="${row.customerLabel}"></span>
                <span th:if="${row.vehicleLabel != null}" th:text="' — ' + ${row.vehicleLabel}"></span>
                <span th:if="${row.customerLabel == null and row.vehicleLabel == null}">--</span>
            </td>
            <td th:text="${row.entry.note}"></td>
            <td class="amount" th:text="'NGN ' + ${#numbers.formatDecimal(row.entry.signedAmount, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
    </tbody>
    <tfoot>
        <tr class="total-row">
            <td colspan="3">Total</td>
            <td class="amount" th:text="'NGN ' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
    </tfoot>
</table>
</body>
</html>
