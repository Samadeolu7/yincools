<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>AC Tech Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 1.5rem;
            background: #ffffff;
            color: #111111;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { font-size: 1.6rem; text-align: center; margin: 0 0 2rem; }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 1rem;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 0.5rem;
            border: 2px solid #333333;
            border-radius: 8px;
        }
        button.submit {
            width: 100%;
            margin-top: 1.5rem;
            padding: 1.1rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            background: #0a6b3d;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .error {
            border: 2px solid #a30000;
            background: #fff0f0;
            color: #a30000;
            border-radius: 10px;
            padding: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
<h1>AC Tech Tracker</h1>

<div class="error" th:if="${param.error != null}">Wrong PIN, try again.</div>

<form method="post" th:action="@{/login}">
    <input type="hidden" name="username" value="shop">
    <label for="password">Enter PIN</label>
    <input type="password" inputmode="numeric" id="password" name="password" autofocus required>
    <button type="submit" class="submit">Unlock</button>
</form>
</body>
</html>
