<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#DD2B1C">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.png">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <title>Yincools</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }
        .brand { text-align: center; margin-bottom: 2rem; }
        .brand img { height: 84px; width: auto; }
        .brand h1 { font-size: 1.4rem; margin: 0.75rem 0 0; }
        input[type="password"] {
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 0.5rem;
        }
        .error {
            border: 2px solid var(--color-primary);
            background: #fff0f0;
            color: var(--color-primary);
            border-radius: var(--radius);
            padding: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="brand">
    <img src="/images/yincools-logo.png" alt="Yincools">
    <h1>Yincools</h1>
</div>

<div class="error" th:if="${param.error != null}">Wrong PIN, try again.</div>

<form method="post" th:action="@{/login}">
    <input type="hidden" name="username" value="shop">
    <label for="password">Enter PIN</label>
    <input type="password" inputmode="numeric" id="password" name="password" autofocus required>
    <button type="submit" class="btn btn-primary">Unlock</button>
</form>
</body>
</html>
