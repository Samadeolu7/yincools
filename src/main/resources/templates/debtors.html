<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <title>Who Owes Me</title>
    <style>
        h1 { font-size: 1.4rem; margin: 0 0 1rem; }
        .debtor {
            display: block;
            padding: 0.9rem;
            margin-bottom: 0.6rem;
            text-decoration: none;
            color: var(--color-ink);
        }
        .debtor .name { font-weight: 700; }
        .debtor .job { color: var(--color-ink-secondary); font-size: 0.95rem; }
        .debtor .balance {
            font-family: var(--font-mono);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-top: 0.35rem;
        }
        .empty {
            text-align: center;
            color: var(--color-ink-secondary);
            border: 2px dashed var(--color-border-subtle);
            border-radius: var(--radius);
            padding: 2rem 1rem;
        }
    </style>
</head>
<body class="has-bottom-nav">
<h1>Who Owes Me</h1>

<p class="empty" th:if="${#lists.isEmpty(debtors)}">Nobody owes you anything right now.</p>

<a class="debtor card" th:each="d : ${debtors}" th:href="@{/jobs/{id}/edit(id=${d.job().id})}">
    <div class="name" th:text="${d.customerLabel()} != null ? ${d.customerLabel()} : 'Unnamed customer'"></div>
    <div class="job" th:text="${d.job().workType} + ' — ' + ${d.vehicleLabel()}"></div>
    <div class="balance" th:text="'NGN ' + ${d.job().cachedBalance}"></div>
</a>

<div th:replace="~{fragments/bottom-nav :: nav('debtors')}"></div>
</body>
</html>
