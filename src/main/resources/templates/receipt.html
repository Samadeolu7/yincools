<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <title>Receipt</title>
    <style>
        h1 { font-size: 1.4rem; margin: 0 0 1rem; }
        .letterhead {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .letterhead-logo { height: 48px; width: auto; }
        .letterhead .business-name { font-size: 1.3rem; font-weight: 700; }
        .letterhead .business-contact { color: var(--color-ink-secondary); font-size: 0.95rem; }
        .receipt-text {
            white-space: pre-wrap;
            font-family: var(--font-mono);
            font-size: 1rem;
            line-height: 1.5;
        }
        .whatsapp { background: #25D366; color: var(--color-surface); }
    </style>
</head>
<body>
<div th:replace="~{fragments/letterhead :: letterhead}"></div>
<h1>Job Saved</h1>

<div class="card receipt-text" th:text="${receiptText}"></div>

<a th:if="${whatsappLink != null}" th:href="${whatsappLink}" class="btn whatsapp" target="_blank">
    Share on WhatsApp
</a>

<a th:href="@{/jobs/{id}/edit(id=${job.id})}" class="btn btn-outline">Fix this entry</a>

<a th:href="@{/jobs/new}" class="btn btn-primary">New job</a>
</body>
</html>
