<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/css/tokens.css">
    <title>This Week</title>
    <style>
        h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
        .range { color: var(--color-ink-secondary); font-size: 0.95rem; margin-bottom: 1.25rem; }
        .stat {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.9rem 0;
            border-bottom: 1px solid var(--color-border-subtle);
        }
        .stat .label { font-weight: 600; }
        .stat .value { font-size: 1.2rem; font-family: var(--font-mono); }
        .profit .value { font-weight: 700; color: var(--color-primary); }
        a.button {
            display: block;
            width: 100%;
            margin-top: 1.5rem;
            padding: 1.1rem;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            border-radius: var(--radius);
            background: var(--color-primary);
            color: var(--color-surface);
        }
    </style>
</head>
<body>
<h1>This Week</h1>
<div class="range" th:text="${summary.weekStart()} + ' to ' + ${summary.weekEnd()}"></div>

<div class="stat">
    <span class="label">Jobs</span>
    <span class="value" th:text="${summary.jobCount()}"></span>
</div>
<div class="stat">
    <span class="label">Charged</span>
    <span class="value" th:text="'NGN ' + ${summary.totalCharged()}"></span>
</div>
<div class="stat">
    <span class="label">Paid</span>
    <span class="value" th:text="'NGN ' + ${summary.totalPaid()}"></span>
</div>
<div class="stat">
    <span class="label">Parts cost</span>
    <span class="value" th:text="'NGN ' + ${summary.totalPartsCost()}"></span>
</div>
<div class="stat">
    <span class="label">Shop expenses</span>
    <span class="value" th:text="'NGN ' + ${summary.totalShopExpenses()}"></span>
</div>
<div class="stat profit">
    <span class="label">Profit</span>
    <span class="value" th:text="'NGN ' + ${summary.profit()}"></span>
</div>

<a th:href="@{/jobs/new}" class="button">Back to New Job</a>
</body>
</html>
