<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>This Week</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 1rem;
            background: #ffffff;
            color: #111111;
            font-size: 18px;
        }
        h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
        .range { color: #555555; font-size: 0.95rem; margin-bottom: 1.25rem; }
        .stat {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.9rem 0;
            border-bottom: 1px solid #dddddd;
        }
        .stat .label { font-weight: 600; }
        .stat .value { font-size: 1.2rem; font-family: ui-monospace, Consolas, monospace; }
        .profit .value { font-weight: 700; color: #0a6b3d; }
        a.button {
            display: block;
            width: 100%;
            margin-top: 1.5rem;
            padding: 1.1rem;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            background: #0a6b3d;
            color: #ffffff;
        }
    </style>
</head>
<body>
<h1>This Week</h1>
<div class="range" th:text="${summary.weekStart()} + ' to ' + ${summary.weekEnd()}"></div>

<div class="stat">
    <span class="label">Jobs</span>
    <span class="value" th:text="${summary.jobCount()}"></span>
</div>
<div class="stat">
    <span class="label">Charged</span>
    <span class="value" th:text="'NGN ' + ${summary.totalCharged()}"></span>
</div>
<div class="stat">
    <span class="label">Paid</span>
    <span class="value" th:text="'NGN ' + ${summary.totalPaid()}"></span>
</div>
<div class="stat">
    <span class="label">Parts cost</span>
    <span class="value" th:text="'NGN ' + ${summary.totalPartsCost()}"></span>
</div>
<div class="stat">
    <span class="label">Shop expenses</span>
    <span class="value" th:text="'NGN ' + ${summary.totalShopExpenses()}"></span>
</div>
<div class="stat profit">
    <span class="label">Profit</span>
    <span class="value" th:text="'NGN ' + ${summary.profit()}"></span>
</div>

<a th:href="@{/jobs/new}" class="button">Back to New Job</a>
</body>
</html>
