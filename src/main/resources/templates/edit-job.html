<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <title>Edit Job</title>
    <style>
        h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    </style>
</head>
<body>
<h1>Edit Job</h1>
<p th:text="${vehicleLabel} + ' — ' + ${job.workType}"></p>

<form method="post" th:action="@{/jobs/{id}/edit(id=${job.id})}">
    <label for="charge">Amount charged</label>
    <input type="text" inputmode="numeric" id="charge" name="charge" th:value="${job.cachedCharge}" required>
    <div class="quick-picks">
        <button type="button" class="quick-pick" th:each="a : ${quickAmounts}"
                th:text="${a}" th:attr="onclick=|setAmount('charge', '${a}')|"></button>
    </div>

    <label for="paid">Amount paid</label>
    <input type="text" inputmode="numeric" id="paid" name="paid" th:value="${job.cachedPaid}">
    <div class="quick-picks">
        <button type="button" class="quick-pick" th:each="a : ${quickAmounts}"
                th:text="${a}" th:attr="onclick=|setAmount('paid', '${a}')|"></button>
    </div>

    <label for="partsCost">Parts cost</label>
    <input type="text" inputmode="numeric" id="partsCost" name="partsCost" th:value="${partsCost}">

    <button type="submit" class="btn btn-primary">Save changes</button>
</form>

<form method="post" th:action="@{/jobs/{id}/void(id=${job.id})}">
    <button type="submit" class="btn btn-outline">Void this job</button>
</form>

<script>
    function setAmount(fieldId, value) {
        document.getElementById(fieldId).value = value;
    }
</script>
</body>
</html>
