<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#DD2B1C">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.png">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <title>New Job</title>
    <style>
        h1 { font-size: 1.4rem; margin: 0 0 1rem; }
        .plate { margin-top: 0.5rem; }
        .last-entry {
            border: 2px solid #b8860b;
            border-radius: var(--radius);
            padding: 0.85rem;
            margin-bottom: 1.25rem;
            background: #fffbea;
        }
        .last-entry .label {
            font-weight: 700;
            font-size: 0.85rem;
            color: #8a6400;
            margin-bottom: 0.35rem;
        }
        .last-entry a {
            display: inline-block;
            margin-top: 0.5rem;
            font-weight: 700;
            color: var(--color-primary);
        }
        nav.insights {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        nav.insights a { color: var(--color-ink-secondary); }
        #partsOther { margin-top: 0.5rem; display: none; }
        #unsyncedBadge {
            display: none;
            margin-bottom: 1rem;
            padding: 0.5rem 0.8rem;
            border-radius: var(--radius-sm);
            background: var(--color-surface-muted);
            color: var(--color-ink-secondary);
            font-size: 0.85rem;
            font-weight: 600;
        }
        #offlineSavedBanner {
            display: none;
            margin-bottom: 1.25rem;
            padding: 0.9rem;
            border: 2px solid #b8860b;
            border-radius: var(--radius);
            background: #fffbea;
        }
        #offlineSavedBanner .label {
            font-weight: 700;
            font-size: 0.85rem;
            color: #8a6400;
            margin-bottom: 0.5rem;
        }
        #offlineSavedBanner pre {
            white-space: pre-wrap;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            margin: 0 0 0.5rem;
        }
        #offlineSavedBanner .wa-link {
            display: inline-block;
            font-weight: 700;
            color: var(--color-primary);
        }
    </style>
</head>
<body>
<h1>New Job</h1>

<nav class="insights">
    <a th:href="@{/insights/week}">This week</a>
    <a th:href="@{/insights/debtors}">Who owes me</a>
    <a th:href="@{/expenses/new}">Shop expense</a>
    <a th:href="@{/quotes/new}">New quote</a>
</nav>

<div id="unsyncedBadge"></div>
<div id="offlineSavedBanner"></div>

<div class="last-entry" th:if="${lastJob != null}">
    <div class="label">LAST ENTRY -- tap to fix</div>
    <div th:text="${lastJob.workType} + ' — ' + ${lastJobVehicleLabel}"></div>
    <div th:if="${lastJobCustomer != null and lastJobCustomer.name != null and !lastJobCustomer.name.isEmpty()}"
         th:text="${lastJobCustomer.name}"></div>
    <div th:text="'Charge: NGN ' + ${lastJob.cachedCharge} + '  Paid: NGN ' + ${lastJob.cachedPaid} + '  Balance: NGN ' + ${lastJob.cachedBalance}"></div>
    <a th:href="@{/jobs/{id}/edit(id=${lastJob.id})}">Edit this entry</a>
</div>

<div th:if="${not #lists.isEmpty(recentCustomers)}">
    <label>Recent customers</label>
    <div class="chip-row">
        <button type="button" class="recent-customer"
                th:each="c : ${recentCustomers}"
                th:text="${c.name != null and !c.name.isEmpty()} ? ${c.name} : ${c.phone}"
                th:attr="data-name=${c.name},data-phone=${c.phone}"
                onclick="fillCustomer(this)"></button>
    </div>
</div>

<form method="post" th:action="@{/jobs}" id="newJobForm">
    <label for="workType">Work type</label>
    <select id="workType" name="workType" required>
        <option th:each="w : ${workTypes}" th:value="${w}" th:text="${w}"></option>
    </select>

    <label for="customerName">Customer name (optional)</label>
    <input type="text" id="customerName" name="customerName">

    <label for="customerPhone">Customer phone (optional)</label>
    <input type="tel" inputmode="tel" id="customerPhone" name="customerPhone" onchange="lookupVehicles(this.value)">
    <div class="hint">Add this later if you want to share a WhatsApp receipt.</div>

    <label for="vehicleDescription">Vehicle (optional)</label>
    <div id="vehiclePicker" class="chip-row" style="display:none;"></div>
    <input type="text" id="vehicleDescription" name="vehicleDescription" list="vehicle-suggestions"
           placeholder="e.g. Camry 2010" oninput="clearVehicleSelection()">
    <datalist id="vehicle-suggestions"></datalist>
    <input type="text" id="vehiclePlateNumber" name="vehiclePlateNumber" class="plate"
           placeholder="Plate number (optional, for fleets)">
    <input type="hidden" id="vehicleId" name="vehicleId">

    <label for="charge">Amount charged</label>
    <input type="text" inputmode="numeric" id="charge" name="charge" required>
    <div class="quick-picks">
        <button type="button" class="quick-pick" th:each="a : ${quickAmounts}"
                th:text="${a}" th:attr="onclick=|setAmount('charge', '${a}')|"></button>
    </div>

    <label for="paid">Amount paid</label>
    <input type="text" inputmode="numeric" id="paid" name="paid" placeholder="0">
    <div class="quick-picks">
        <button type="button" class="quick-pick" th:each="a : ${quickAmounts}"
                th:text="${a}" th:attr="onclick=|setAmount('paid', '${a}')|"></button>
    </div>

    <label for="partsCost">Parts cost (optional)</label>
    <input type="text" inputmode="numeric" id="partsCost" name="partsCost" placeholder="0">
    <div id="partsChips" class="chip-row"></div>
    <input type="text" id="partsOther" placeholder="Other part">
    <input type="hidden" id="partsNote" name="partsNote">
    <div class="checkbox-row">
        <input type="checkbox" id="sharedPartsCost" name="sharedPartsCost" value="true">
        <label for="sharedPartsCost">Shared across today's visit (not just this car)</label>
    </div>

    <button type="submit" class="btn btn-primary">Save job</button>
</form>

<script th:inline="javascript">
    function setAmount(fieldId, value) {
        document.getElementById(fieldId).value = value;
    }
    window.YINCOOLS_BUSINESS_NAME = /*[[${businessName}]]*/ 'Yincools';
</script>
<script src="/vehicle-picker.js"></script>
<script src="/parts-chips.js"></script>
<script src="/offline-queue.js"></script>
</body>
</html>
