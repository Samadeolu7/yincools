# Activated via SPRING_PROFILES_ACTIVE=prod (see docker-compose.yml).
# All values below are meant to come from environment variables set in the
# deployment's .env -- see .env.example for what each one means.

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console is a dev-only tool -- never reachable in production, regardless
# of login, since it would let anyone with the PIN browse raw SQL.
spring.h2.console.enabled=false

app.pin=${APP_PIN}
app.remember-me-key=${APP_REMEMBER_ME_KEY}
