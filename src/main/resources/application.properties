spring.application.name=Yincools

spring.datasource.url=jdbc:h2:file:./data/yincools;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Single-user PIN login; override APP_PIN in real deployments.
app.pin=${APP_PIN:1234}
app.remember-me-key=${APP_REMEMBER_ME_KEY:dev-only-insecure-key}

# Only /actuator/health is exposed -- used by the Docker/Traefik healthcheck,
# not a general management API. Permitted without login in SecurityConfig.
management.endpoints.web.exposure.include=health

# Letterhead shown on receipts and quotes, matching the real shop letterhead.
# Plain config, not a database table -- there's one shop, nothing here needs
# to be editable through a screen. Defaults are the real published business
# details (not secrets) so a fresh checkout renders the real letterhead.
app.business.name=${APP_BUSINESS_NAME:Yincools}
app.business.suffix=${APP_BUSINESS_SUFFIX:AUTO NIG.}
app.business.tagline=${APP_BUSINESS_TAGLINE:Specialist in Car-Condition & any Automobile Works}
app.business.address=${APP_BUSINESS_ADDRESS:73, Mercy Eneli Street, (Owolarafe Motors) Off Alhaji Masha, Surulere, Lagos.}
app.business.whatsapp=${APP_BUSINESS_WHATSAPP:081 4404 9067}
app.business.tel=${APP_BUSINESS_TEL:0802 333 2171}
app.business.email=${APP_BUSINESS_EMAIL:yincoolsautotech@gmail.com}
# Pipe-separated so multiple bankers can be listed without a database table.
app.business.bankers=${APP_BUSINESS_BANKERS:Eco Bank Plc, Adeniran Ogunsanya Str, Surulere, Lagos|U.B.A. Bode Thomas Str, Surulere, Lagos}
