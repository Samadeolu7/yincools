spring.application.name=Yincools

spring.datasource.url=jdbc:h2:file:./data/yincools;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Single-user PIN login; override APP_PIN in real deployments.
app.pin=${APP_PIN:1234}
app.remember-me-key=${APP_REMEMBER_ME_KEY:dev-only-insecure-key}

# Only /actuator/health is exposed -- used by the Docker/Traefik healthcheck,
# not a general management API. Permitted without login in SecurityConfig.
management.endpoints.web.exposure.include=health

# Letterhead shown on receipts and quotes. Plain config, not a database
# table -- there's one shop, nothing here needs to be editable through a screen.
app.business.name=${APP_BUSINESS_NAME:Yincools}
app.business.phone=${APP_BUSINESS_PHONE:}
app.business.address=${APP_BUSINESS_ADDRESS:}
